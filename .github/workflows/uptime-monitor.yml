name: Uptime Monitor

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-api:
    name: Check API Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        id: health
        run: |
          for i in 1 2 3; do
            response=$(curl -s -w "\n%{http_code}" --max-time 90 https://api.mousebase.dev/health/ || echo -e "\n000")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "Attempt $i: HTTP $http_code"

            if [ "$http_code" = "200" ]; then
              echo "status=healthy" >> $GITHUB_OUTPUT
              echo "body=$body" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep 60
          done

          echo "status=unhealthy" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `API Health Check Failed - ${new Date().toISOString().slice(0, 16)}`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
              per_page: 100,
            });

            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              console.log('Issue already exists, skipping');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## API Health Check Failed\n\n` +
                    `**Time:** ${new Date().toISOString()}\n` +
                    `**Endpoint:** https://api.mousebase.dev/health/\n` +
                    `**Response:**\n\`\`\`json\n${process.env.HEALTH_BODY || 'No response'}\n\`\`\`\n\n` +
                    `### Actions\n` +
                    `- [ ] Check Render dashboard for errors\n` +
                    `- [ ] Check Neon database status\n` +
                    `- [ ] Verify DNS resolution\n` +
                    `- [ ] Resolve and close this issue`,
              labels: ['incident'],
            });

      - name: Record uptime
        if: success()
        run: |
          echo "✅ API healthy at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 https://mousebase.dev/ || echo "000")
          echo "Frontend status: HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
