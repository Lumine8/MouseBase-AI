[project]
name = "mousebase-backend"
version = "0.1.0"
description = "Persistent memory infrastructure for AI applications."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MouseBase" }]
license = { text = "Proprietary" }
keywords = ["mousebase", "memory", "ai", "sdk", "httpx"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pgvector",
    "python-dotenv",
    "pydantic-settings",
    "openai>=2.44.0",
    "google-genai>=2.10.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.0.0",
    "redis>=5.0.0",
    "jinja2",
    "razorpay>=1.4.0",
    "sentry-sdk>=2.0.0",
    "slowapi>=0.1.9",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.20,<0.16.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations", "temp_migrations", "scripts"]

[tool.ruff.lint]
extend-ignore = [
    "B008",   # Depends() in function args — standard FastAPI pattern
    "BLE001", # Blind except — intentional in fallback/retry paths
    "S110",   # try-except-pass — intentional fallback pattern
    "DTZ011", # date.today() without tz — acceptable for daily buckets
    "RUF012", # Mutable class attrs — standard for SQLAlchemy models
    "I001",   # Import block sorting — handled by black/isort
    "UP045",  # Optional[X] -> X | None — not enforced
    "UP017",  # datetime.UTC alias — not enforced
    "UP035",  # collections.abc imports — not enforced
    "UP037",  # Remove quotes from annotations — not enforced
    "RUF010", # Explicit conversion flag — not enforced
    "RUF022", # __all__ not sorted — not enforced
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "mousebase*"]
exclude = [
    "tests*",
    "migrations*",
    "temp_migrations*",
]

[tool.setuptools.package-data]
mousebase = ["py.typed"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"